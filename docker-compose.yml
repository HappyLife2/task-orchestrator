services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_SECRET=super-secret-jwt-key-dev-only
      - NEXTAUTH_URL=https://olden-pok-hyperrationally.ngrok-free.dev
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command:
      - "http"
      - "--url=https://olden-pok-hyperrationally.ngrok-free.dev"
      - "web:3000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - web
    ports:
      - "4040:4040"
