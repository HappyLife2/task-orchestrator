version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_SECRET=your-secret
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command:
      - "http"
      - "web:3000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - web
    ports:
      - "4040:4040"
